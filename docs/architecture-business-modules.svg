<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08121c"/>
      <stop offset="100%" stop-color="#10283b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ee6c2"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #eef8ff; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #a9c6d8; }
      .node-title { font: 700 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #f8feff; }
      .node-note { font: 400 14px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #c0d7e4; }
      .small { font: 400 13px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #a9c6d8; }
      .line { stroke: #8ee6c2; stroke-width: 2.4; fill: none; marker-end: url(#arrow); opacity: 0.92; }
      .line-blue { stroke: #80d7ff; stroke-width: 2.2; fill: none; marker-end: url(#arrow); opacity: 0.84; }
      .line-purple { stroke: #b9a8ff; stroke-width: 2.2; fill: none; marker-end: url(#arrow); opacity: 0.84; }
      .feature { fill: #173553; stroke: #5bc7ff; stroke-width: 2; }
      .domain { fill: #153b35; stroke: #67e0b1; stroke-width: 2; }
      .center { fill: #1d4053; stroke: #83dcff; stroke-width: 2; }
      .data { fill: #2c304c; stroke: #b9a8ff; stroke-width: 2; }
      .core { fill: #3a2f28; stroke: #ffbe75; stroke-width: 2; }
      .note-box { fill: rgba(255,255,255,0.045); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1700" height="1200" fill="url(#bg)"/>
  <text x="72" y="70" class="title">CarAppStore 七个业务模块关系图</text>
  <text x="72" y="102" class="subtitle">下载 / 安装 / 升级负责执行；状态中心负责运行态；策略中心负责前置判断；Repository 负责数据聚合；AppManager 面向页面提供视图模型</text>

  <g filter="url(#shadow)">
    <rect x="588" y="150" width="264" height="80" rx="12" class="feature"/>
    <text x="642" y="184" class="node-title">Feature ViewModel</text>
    <text x="638" y="208" class="node-note">页面事件入口 / UI 状态订阅</text>

    <rect x="90" y="350" width="230" height="92" rx="12" class="domain"/>
    <text x="160" y="385" class="node-title">下载模块</text>
    <text x="130" y="410" class="node-note">DefaultDownloadManager</text>
    <text x="122" y="430" class="small">任务创建、恢复、暂停、取消</text>

    <rect x="380" y="350" width="230" height="92" rx="12" class="domain"/>
    <text x="450" y="385" class="node-title">安装模块</text>
    <text x="422" y="410" class="node-note">DefaultInstallManager</text>
    <text x="428" y="430" class="small">Session 管理与系统确认</text>

    <rect x="670" y="350" width="230" height="92" rx="12" class="domain"/>
    <text x="740" y="385" class="node-title">升级模块</text>
    <text x="714" y="410" class="node-note">DefaultUpgradeManager</text>
    <text x="726" y="430" class="small">版本检查与批量编排</text>

    <rect x="960" y="350" width="230" height="92" rx="12" class="domain"/>
    <text x="1018" y="385" class="node-title">应用管理</text>
    <text x="1009" y="410" class="node-note">DefaultAppManager</text>
    <text x="1000" y="430" class="small">首页 / 搜索 / 我的应用聚合</text>

    <rect x="225" y="590" width="250" height="96" rx="12" class="center"/>
    <text x="294" y="627" class="node-title">状态中心</text>
    <text x="286" y="652" class="node-note">DefaultStateCenter</text>
    <text x="264" y="672" class="small">状态归约、进度、按钮态、文案</text>

    <rect x="595" y="590" width="250" height="96" rx="12" class="center"/>
    <text x="664" y="627" class="node-title">策略中心</text>
    <text x="654" y="652" class="node-note">DefaultPolicyCenter</text>
    <text x="636" y="672" class="small">Wi-Fi / 驻车 / 存储 / 设置流</text>

    <rect x="965" y="590" width="250" height="96" rx="12" class="data"/>
    <text x="1032" y="627" class="node-title">Repository</text>
    <text x="1028" y="652" class="node-note">RealAppRepository</text>
    <text x="1011" y="672" class="small">remote / local / system 数据聚合</text>

    <rect x="185" y="810" width="250" height="70" rx="12" class="core"/>
    <text x="236" y="853" class="node-title">FileDownloader</text>

    <rect x="505" y="810" width="250" height="70" rx="12" class="core"/>
    <text x="548" y="853" class="node-title">PackageInstaller</text>

    <rect x="825" y="810" width="250" height="70" rx="12" class="core"/>
    <text x="877" y="853" class="node-title">JSON Store</text>
  </g>

  <path d="M 625 230 C 460 275, 270 295, 205 350" class="line-blue"/>
  <path d="M 680 230 C 610 285, 540 305, 495 350" class="line-blue"/>
  <path d="M 760 230 C 790 285, 790 305, 785 350" class="line-blue"/>
  <path d="M 825 230 C 965 270, 1040 300, 1075 350" class="line-blue"/>

  <path d="M 205 442 C 210 500, 270 540, 350 590" class="line"/>
  <path d="M 495 442 C 470 515, 410 548, 350 590" class="line"/>
  <path d="M 785 442 C 720 505, 510 545, 350 590" class="line"/>
  <path d="M 1075 442 C 915 520, 620 548, 350 590" class="line"/>

  <path d="M 205 442 C 300 505, 570 530, 720 590" class="line"/>
  <path d="M 495 442 C 550 510, 650 535, 720 590" class="line"/>
  <path d="M 785 442 C 785 500, 760 535, 720 590" class="line"/>

  <path d="M 205 442 C 420 555, 790 555, 1090 590" class="line-purple"/>
  <path d="M 495 442 C 650 545, 890 552, 1090 590" class="line-purple"/>
  <path d="M 785 442 C 870 520, 990 548, 1090 590" class="line-purple"/>
  <path d="M 1075 442 C 1085 500, 1090 535, 1090 590" class="line-purple"/>

  <path d="M 205 442 C 205 620, 250 700, 310 810" class="line-blue"/>
  <path d="M 495 442 C 520 640, 585 715, 630 810" class="line-blue"/>
  <path d="M 1090 686 C 1060 750, 1010 780, 950 810" class="line-purple"/>

  <rect x="82" y="902" width="1276" height="42" rx="10" class="note-box"/>
  <text x="112" y="928" class="small">边界原则：feature 不直接访问 data/core；下载、安装、升级不彼此穿透内部实现；跨模块调用通过公开接口完成。</text>
</svg>
