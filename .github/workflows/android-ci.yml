name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify tests, lint and APK builds
        run: ./gradlew testDebugUnitTest compileDebugKotlin lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload verification outputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: carappstore-verification-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            **/build/reports/lint-results-debug.html
            **/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
