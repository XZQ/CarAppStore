name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Create ephemeral CI signing key
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "CARAPPSTORE_CI_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/carappstore-ci.p12" \
            -storetype PKCS12 \
            -storepass "$password" \
            -keypass "$password" \
            -alias carappstore-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CarAppStore CI,OU=Engineering,O=CarAppStore,L=CI,ST=CI,C=US"

      - name: Verify report summarizer
        run: python3 -m unittest discover -s tools/verification -p 'test_*.py'

      - name: Verify tests, lint and APK builds
        env:
          CARAPPSTORE_CATALOG_PROD_URL: https://catalog.ci.carappstore.dev/catalog.json
          CARAPPSTORE_DOWNLOAD_PROD_BASE_URL: https://downloads.ci.carappstore.dev/apks
          CARAPPSTORE_CATALOG_AUTH_MODE: PUBLIC
          CARAPPSTORE_DOWNLOAD_AUTH_MODE: SIGNED_URL
          CARAPPSTORE_RELEASE_STORE_FILE: ${{ runner.temp }}/carappstore-ci.p12
          CARAPPSTORE_RELEASE_STORE_PASSWORD: ${{ env.CARAPPSTORE_CI_KEY_PASSWORD }}
          CARAPPSTORE_RELEASE_KEY_ALIAS: carappstore-ci
          CARAPPSTORE_RELEASE_KEY_PASSWORD: ${{ env.CARAPPSTORE_CI_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest testReleaseUnitTest compileDebugKotlin lintDebug lintRelease :app:assembleDebug assembleProductionRelease --no-daemon --stacktrace --continue

      - name: Summarize verification reports
        if: always()
        run: |
          report_status=0
          python3 tools/verification/summarize_android_checks.py || report_status=$?
          cat build/verification/android-checks.md >> "$GITHUB_STEP_SUMMARY"
          exit "$report_status"

      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carappstore-verification-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            **/build/reports/lint-results-debug.html
            **/build/reports/lint-results-debug.xml
            **/build/reports/lint-results-release.html
            **/build/reports/lint-results-release.xml
            **/build/reports/tests/**
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/test-results/testReleaseUnitTest/*.xml
            build/verification/*
          if-no-files-found: error
          retention-days: 14
